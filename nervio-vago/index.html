<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reseteo del Nervio Vago 28 · Test de 1 minuto</title>
<meta name="description" content="Hacé el test de 1 minuto y recibí tu plan de 28 días para salir del modo alerta.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5FB; --card:#FFFFFF; --card2:#FBFAFE; --line:#E6E1F0;
  --ink:#1F1A2E; --soft:#6B6680;
  --ac:#6E4FD0; --ac2:#8E74E6; --acbg:#EFEAFC;
  --ok:#4E9A78; --okbg:#E7F4EE;
  --al:#E0605A; --albg:#FDECEB;
  --shadow:0 10px 30px rgba(60,40,120,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#sp{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
#sp h1,#sp h2{font-family:'Fraunces',Georgia,serif;font-weight:700;line-height:1.15;letter-spacing:-.01em}

/* header */
.sp-bar{height:4px;background:var(--line)}
.sp-bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .45s cubic-bezier(.4,0,.2,1)}
.sp-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(247,245,251,.92);backdrop-filter:blur(6px);position:sticky;top:0;z-index:4}
.sp-back{background:none;border:none;color:var(--soft);font-size:28px;line-height:1;cursor:pointer;width:34px;text-align:left;opacity:0;pointer-events:none;transition:opacity .2s}
.sp-back.show{opacity:1;pointer-events:auto}
.sp-logo{font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:var(--ink)}
.sp-logo .am{color:var(--ac)}
.sp-count{font-size:11.5px;font-weight:700;color:var(--soft);min-width:44px;text-align:right}

.sp-stage{padding:22px 18px 40px;animation:spIn .35s cubic-bezier(.2,.7,.2,1)}
@keyframes spIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.sp-phase{display:block;text-align:center;text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700;color:var(--ac);margin-bottom:10px}
.sp-h{font-size:26px;text-align:center;margin-bottom:8px}
.sp-h .am,.sp-inter h1 .am,.sp-sec-h .am{color:var(--ac)}
.sp-sub{text-align:center;color:var(--soft);font-size:15px;line-height:1.45;margin-bottom:20px}

/* cards */
.sp-grid{display:grid;gap:11px}
.sp-grid.cols2{grid-template-columns:1fr 1fr}
.sp-card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:left;position:relative;box-shadow:0 2px 8px rgba(60,40,120,.04)}
.sp-card:hover{border-color:var(--ac2)}
.sp-card:active{transform:scale(.98)}
.sp-card.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac);background:var(--acbg)}
.sp-thumb{width:100%;aspect-ratio:3/4;background:linear-gradient(160deg,#EEE9F8,#E3DCF3);display:flex;align-items:center;justify-content:center;color:#9A90B5;font-size:12px;font-weight:600}
.sp-thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.sp-card .sp-label{padding:12px 14px;font-weight:700;font-size:15.5px;display:flex;justify-content:space-between;align-items:center}
.sp-card .sp-label::after{content:'›';color:var(--ac);font-size:22px;line-height:1}
.sp-card.row{display:flex;align-items:center}
.sp-card.row .sp-label{padding:17px 16px;flex:1}
.sp-card.row.multi .sp-label::after{display:none}
.sp-cap{display:block;font-weight:500;font-size:12.5px;color:var(--soft);margin-top:2px}
.sp-check{margin-right:15px;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:.15s}
.sp-card.sel .sp-check{background:var(--ac);border-color:var(--ac)}
.sp-quoteq{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:4px 0 18px;text-align:center;font-family:'Fraunces',serif;font-size:20px;line-height:1.35;box-shadow:var(--shadow)}

/* buttons */
.sp-cta{display:block;width:100%;margin-top:22px;padding:17px;border:none;border-radius:14px;font-family:inherit;font-weight:800;font-size:16.5px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--ac2),var(--ac));box-shadow:0 10px 24px rgba(110,79,208,.3);transition:transform .15s,filter .2s;text-align:center;text-decoration:none;position:relative;overflow:hidden}
.sp-cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:spShine 3.2s infinite}
@keyframes spShine{0%{left:-60%}55%,100%{left:130%}}
.sp-cta:disabled{opacity:.4;cursor:not-allowed}
.sp-cta:disabled::after{display:none}
.sp-cta.sticky{position:sticky;bottom:12px}

.sp-input{width:100%;padding:17px;font-size:18px;text-align:center;font-family:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;outline:none}
.sp-input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(110,79,208,.15)}

/* interstitials */
.sp-inter{text-align:center;padding:6px 0}
.sp-inter-img{width:100%;aspect-ratio:1/1;border-radius:20px;overflow:hidden;margin:0 0 18px;background:linear-gradient(160deg,#EEE9F8,#E3DCF3);box-shadow:var(--shadow)}
.sp-inter-img img{width:100%;height:100%;object-fit:cover;display:block}
.sp-icon{width:76px;height:76px;border-radius:50%;margin:10px auto 18px;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--acbg)}
.sp-inter h1{font-size:25px;margin-bottom:12px}
.sp-inter p{color:var(--soft);font-size:15.5px;line-height:1.6;max-width:430px;margin:0 auto}
.sp-inter p b{color:var(--ink)}
.sp-quote{background:var(--acbg);border-radius:14px;padding:14px 16px;color:var(--ink);font-size:14.5px;line-height:1.5;margin:16px auto 0;max-width:430px;text-align:left}
.sp-big{font-family:'Fraunces',serif;font-size:44px;font-weight:700;color:var(--ac);margin:4px 0}
.sp-empathy{background:var(--okbg);border-radius:14px;padding:16px 18px;margin-top:16px;text-align:left;animation:spIn .35s}
.sp-empathy b{color:var(--ok);display:block;margin-bottom:5px;font-size:15px}
.sp-empathy p{color:var(--ink);font-size:14px;line-height:1.55}

/* result */
.sp-result{text-align:center}
.sp-scorecard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 16px;box-shadow:var(--shadow);margin:6px 0 16px}
.sp-level{display:inline-block;background:var(--albg);color:var(--al);font-weight:800;font-size:13px;padding:6px 12px;border-radius:30px;margin:6px 0 10px}
.sp-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);font-weight:600;margin-top:6px}
.sp-scalebar{height:10px;border-radius:6px;background:linear-gradient(90deg,#7CC4A1,#F2C66D,#F09A5B,#E0605A);position:relative;margin-top:22px}
.sp-pin{position:absolute;top:-28px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;white-space:nowrap;transition:left 1.4s cubic-bezier(.2,.7,.2,1)}
.sp-pin::after{content:'';position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
.sp-pin-dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--ink);transform:translate(-50%,-50%);transition:left 1.4s cubic-bezier(.2,.7,.2,1)}
.sp-alert{background:var(--albg);border-radius:14px;padding:14px 16px;text-align:left;font-size:14px;line-height:1.5;margin:14px 0}
.sp-alert b{color:var(--al)}
.sp-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.sp-fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.sp-fact .k{font-size:11.5px;color:var(--soft);font-weight:600}
.sp-fact .v{font-weight:800;font-size:15px;margin-top:3px}
.sp-fact .v.bad{color:var(--al)} .sp-fact .v.good{color:var(--ok)}
.sp-vsbox{display:flex;gap:10px;margin:16px 0}
.sp-vsbox>div{flex:1;border-radius:14px;padding:14px 10px;text-align:center}
.sp-vsbox .nowb{background:var(--albg)} .sp-vsbox .goalb{background:var(--okbg)}
.sp-vsbox .lab{font-size:11.5px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sp-vsbox .v{font-family:'Fraunces',serif;font-weight:700;font-size:20px;margin-top:4px}
.sp-vsbox .nowb .v{color:var(--al)} .sp-vsbox .goalb .v{color:var(--ok)}
.sp-attack{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin:16px 0;text-align:left}
.sp-attack b{color:var(--ac);font-size:14px;display:block;margin-bottom:8px}
.sp-attack .z{display:flex;align-items:center;gap:9px;font-size:14.5px;margin:6px 0;opacity:0;transform:translateX(-10px);transition:opacity .4s,transform .4s}
.sp-attack .z.in{opacity:1;transform:none}
.sp-attack .z .ck{color:var(--ok);font-weight:800}

/* loader */
.sp-loader{text-align:center;padding:30px 0}
.sp-ringwrap{width:150px;height:150px;margin:0 auto 10px;position:relative}
.sp-ringwrap svg{transform:rotate(-90deg)}
.sp-ring{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:38px;color:var(--ac)}
.sp-lsteps{text-align:left;max-width:340px;margin:20px auto 0;display:grid;gap:10px}
.sp-lsteps div{font-size:14.5px;color:var(--soft);display:flex;gap:9px;align-items:center}
.sp-lsteps div.on{color:var(--ink);font-weight:600}
.sp-lsteps .d{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex:none}
.sp-lsteps .on .d{background:var(--ok);border-color:var(--ok)}
.sp-ltst{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:22px auto 0;max-width:380px;text-align:left;font-size:13.5px;line-height:1.5}
.sp-ltst .st{color:#F2B33D;letter-spacing:2px;font-size:13px}

/* SALE */
.sp-timer{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}
.sp-timer .t{font-size:12.5px;line-height:1.25}
.sp-timer .t b{font-size:20px;font-family:'Fraunces',serif;display:block}
.sp-timer a{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;text-decoration:none;font-weight:800;font-size:13.5px;padding:11px 16px;border-radius:12px;white-space:nowrap}
.sp-salebody{padding:20px 18px 40px}
.sp-ba{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);margin:14px 0}
.sp-ba-img{position:relative;aspect-ratio:3/2;background:linear-gradient(160deg,#EEE9F8,#E3DCF3);display:flex;align-items:center;justify-content:center;color:#9A90B5;font-size:13px}
.sp-ba-img img{width:100%;height:100%;object-fit:cover;display:block}
.sp-ba-tags{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between}
.sp-ba-tags span{background:rgba(255,255,255,.92);font-weight:800;font-size:12px;padding:5px 11px;border-radius:20px}
.sp-ba-rows{display:grid;grid-template-columns:1fr 1fr}
.sp-ba-rows>div{padding:11px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--soft)}
.sp-ba-rows>div:nth-child(odd){border-right:1px solid var(--line)}
.sp-ba-rows b{display:block;color:var(--ink);font-size:14px;margin:2px 0 6px}
.sp-seg{display:flex;gap:3px}.sp-seg i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.sp-seg.bad i.f{background:var(--al)} .sp-seg.good i.f{background:var(--ok)}
.sp-promo{display:flex;align-items:center;gap:10px;background:var(--okbg);border:1.5px dashed var(--ok);border-radius:14px;padding:12px 14px;margin:16px 0 12px;font-size:13.5px}
.sp-promo b{color:var(--ok)}
.sp-promo code{margin-left:auto;background:#fff;border-radius:8px;padding:5px 9px;font-weight:800;font-family:inherit;font-size:13px}
.sp-offer{background:var(--card);border:2px solid var(--ac);border-radius:20px;padding:18px 16px 16px;position:relative;box-shadow:0 12px 30px rgba(110,79,208,.15)}
.sp-offer .tagtop{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;font-size:11.5px;font-weight:800;padding:4px 12px;border-radius:20px;white-space:nowrap}
.sp-offer-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sp-offer .n{font-weight:800;font-size:16.5px}
.sp-offer .n small{display:block;font-weight:600;font-size:12.5px;color:var(--soft);margin-top:2px}
.sp-offer .old{color:var(--soft);text-decoration:line-through;font-size:14px}
.sp-offer .now{font-family:'Fraunces',serif;font-weight:700;font-size:30px;color:var(--ink);line-height:1.05}
.sp-offer .pd{display:inline-block;background:var(--acbg);color:var(--ac);font-weight:800;font-size:12.5px;padding:4px 9px;border-radius:8px;margin-top:4px}
.sp-offer .off{display:inline-block;background:var(--al);color:#fff;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:7px}
.sp-offer .bon{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--ok);font-weight:700}
.sp-fine{font-size:11.5px;color:var(--soft);text-align:center;margin-top:10px;line-height:1.5}
.sp-pay{text-align:center;margin:14px 0 4px}
.sp-pay>span{font-size:12.5px;color:var(--ok);font-weight:700;display:block;margin-bottom:8px}
.sp-cards{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sp-cards span{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-weight:700;font-size:11px}
.sp-sec{margin:30px 0}
.sp-sec-h{font-size:22px;text-align:center;margin-bottom:16px}
.sp-goals{list-style:none;display:grid;gap:10px}
.sp-goals li{display:flex;gap:11px;align-items:flex-start;font-size:15px;line-height:1.4}
.sp-goals li .ck{width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.sp-incl{list-style:none;display:grid;gap:10px}
.sp-incl li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:14px;line-height:1.45}
.sp-incl li .e{font-size:22px;flex:none}
.sp-incl li b{display:block;font-size:14.5px}
.sp-incl li span.s{color:var(--soft)}
.sp-incl li .val{margin-left:auto;font-size:12px;color:var(--soft);text-decoration:line-through;white-space:nowrap;padding-left:6px}
.sp-mock{border-radius:20px;overflow:hidden;aspect-ratio:3/2;background:linear-gradient(160deg,#EEE9F8,#E3DCF3);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:#9A90B5}
.sp-mock img{width:100%;height:100%;object-fit:cover;display:block}
.sp-stats{display:grid;gap:10px}
.sp-stat{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:13.5px;line-height:1.4}
.sp-stat b{font-family:'Fraunces',serif;font-size:28px;color:var(--ac);flex:none;min-width:70px}
.sp-how{display:grid;gap:14px}
.sp-how .st{display:flex;gap:13px;align-items:flex-start}
.sp-how .num{width:36px;height:36px;flex:none;border-radius:50%;background:var(--acbg);color:var(--ac);font-weight:800;display:flex;align-items:center;justify-content:center}
.sp-how b{display:block;font-size:15px;margin-bottom:2px}
.sp-how p{color:var(--soft);font-size:13.5px;line-height:1.45}
.sp-tst{display:grid;gap:12px}
.sp-tst .c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px}
.sp-tst .top{display:flex;justify-content:space-between;align-items:center}
.sp-tst .stars{color:#F2B33D;font-size:13px;letter-spacing:2px}
.sp-tst .ver{font-size:11px;color:var(--ok);font-weight:700}
.sp-tst .tt{font-weight:800;font-size:14.5px;margin:7px 0 4px}
.sp-tst .q{font-size:13.5px;line-height:1.55;color:#3A3550}
.sp-tst .who{font-size:12.5px;color:var(--soft);margin-top:8px;font-weight:600}
.sp-faq .it{border-bottom:1px solid var(--line)}
.sp-faq .q{width:100%;text-align:left;background:none;border:none;color:var(--ink);font-family:inherit;font-size:15px;font-weight:700;padding:16px 30px 16px 0;cursor:pointer;position:relative}
.sp-faq .q::after{content:'+';position:absolute;right:4px;top:13px;font-size:22px;color:var(--ac);font-weight:500}
.sp-faq .it.open .q::after{content:'–'}
.sp-faq .a{max-height:0;overflow:hidden;transition:max-height .25s ease;color:var(--soft);font-size:14px;line-height:1.55}
.sp-faq .it.open .a{max-height:300px;padding-bottom:15px}
.sp-guar{display:flex;gap:14px;align-items:flex-start;background:var(--okbg);border-radius:16px;padding:16px;margin:22px 0;font-size:13.5px;line-height:1.5}
.sp-guar .g{font-size:30px}
.sp-guar b{display:block;font-size:15.5px;margin-bottom:3px}
.sp-disc{font-size:10.5px;color:#9A94AD;text-align:center;margin-top:22px;line-height:1.5}
@media(max-width:360px){.sp-h{font-size:23px}}

/* componentes: slider / proyección */
.sp-pj-wrap{width:100%;padding:0 0 4px}
.sp-pj-headline{font-size:15px;font-weight:800;text-align:center;margin:0 0 10px}
.sp-pj-svg{width:100%;display:block;overflow:visible}
.sp-pj-axis-label{fill:var(--soft);font-size:11px;font-family:Inter,sans-serif}
.sp-pj-weight-label{font-size:12.5px;font-weight:800;font-family:Inter,sans-serif}
.sp-pj-dot{animation:sp-pj-pulse 1.8s ease-in-out infinite}
@keyframes sp-pj-pulse{0%,100%{opacity:1}50%{opacity:.45}}
</style>
</head>
<body>
<div id="sp">
  <div class="sp-bar"><div class="sp-bar-fill" id="spBar"></div></div>
  <header class="sp-top">
    <button class="sp-back" id="spBack" aria-label="Atrás">‹</button>
    <span class="sp-logo" id="spLogo"></span>
    <span class="sp-count" id="spCount"></span>
  </header>
  <main class="sp-stage" id="spStage"></main>
</div>

<script>
/* ---------- componente: gráfico de proyección (baja de un valor a otro) ---------- */
function spProjection(o){
  var NS='http://www.w3.org/2000/svg',W=320,H=170,PL=46,PR=30,PT=20,PB=30;
  var wrap=document.createElement('div');wrap.className='sp-pj-wrap';
  var h=document.createElement('p');h.className='sp-pj-headline';h.innerHTML=o.headline;wrap.appendChild(h);
  var svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('class','sp-pj-svg');
  svg.innerHTML='<defs><linearGradient id="pjl" x1="0" x2="1"><stop offset="0" stop-color="#E0605A"/><stop offset=".55" stop-color="#F2C66D"/><stop offset="1" stop-color="#4E9A78"/></linearGradient>'+
    '<linearGradient id="pja" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E74E6" stop-opacity=".22"/><stop offset="1" stop-color="#8E74E6" stop-opacity="0"/></linearGradient></defs>';
  var x0=PL,x1=W-PR,y0=PT,y1=H-PB,pts=[],N=60;
  for(var g=0;g<4;g++){var gy=y0+(y1-y0)*g/3;svg.innerHTML+='<line x1="'+x0+'" x2="'+x1+'" y1="'+gy+'" y2="'+gy+'" stroke="#E6E1F0" stroke-dasharray="3 4"/>';}

/* ---------- cálculo del diagnóstico ---------- */
function diag(){
  var A=state.answers,S=state.score,keys=Object.keys(S),sum=0;keys.forEach(function(k){sum+=S[k];});
  var max=STEPS.filter(function(s){return s.score;}).length*3;
  var extra=(A.zonas||[]).length+(A.sueno||[]).length;
  var pct=Math.round(Math.min(96,Math.max(38,(sum/max)*100*0.85+extra*1.6+12)));
  var level=pct>=75?'Alta':pct>=55?'Media':'Leve';
  var signs=Math.min(50,Math.round(pct/2+extra));
  var energy=Math.max(14,Math.min(48,100-pct-8));
  var weeks=4,end=new Date(Date.now()+28*864e5);
  var meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return {pct:pct,level:level,signs:signs,energy:energy,end:end.getDate()+' de '+meses[end.getMonth()],stress:(Math.round(pct/10*10)/10/1).toFixed(0)};
}

function runLoader(){
  bar.style.width='100%';countEl.textContent='';backBtn.classList.remove('show');
  var C=2*Math.PI*66;
  stage.innerHTML='<div class="sp-loader"><div class="sp-ringwrap"><svg width="150" height="150"><circle cx="75" cy="75" r="66" stroke="#E6E1F0" stroke-width="10" fill="none"/><circle id="spArc" cx="75" cy="75" r="66" stroke="url(#lg)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/><defs><linearGradient id="lg"><stop offset="0" stop-color="#8E74E6"/><stop offset="1" stop-color="#6E4FD0"/></linearGradient></defs></svg><div class="sp-ring" id="spPct">0%</div></div>'+
    '<h1 class="sp-h" style="font-size:21px">Analizando tus respuestas…</h1>'+
    '<div class="sp-lsteps"><div data-at="0"><span class="d">✓</span>Leyendo tus síntomas</div><div data-at="30"><span class="d">✓</span>Midiendo tu nivel de alerta</div><div data-at="60"><span class="d">✓</span>Eligiendo tus ejercicios</div><div data-at="88"><span class="d">✓</span>Armando tu plan de 28 días</div></div>'+
    '<div class="sp-ltst"><div class="st">★★★★★</div><b>“Lo hice en la cocina, con el mate”</b><br>Pensé que era una pavada y a la semana ya dormía mejor. Cortito y fácil de seguir. <span style="color:var(--soft)">— Silvina, 47</span></div></div>';
  var p=0,arc=document.getElementById('spArc'),pe=document.getElementById('spPct'),ls=stage.querySelectorAll('.sp-lsteps div');
  var iv=setInterval(function(){p+=Math.random()*4+1.4;if(p>100)p=100;pe.textContent=Math.floor(p)+'%';arc.setAttribute('stroke-dashoffset',C*(1-p/100));
    ls.forEach(function(d){if(p>=+d.dataset.at+8)d.classList.add('on');});
    if(p>=100){clearInterval(iv);setTimeout(renderResult,500);}},120);
}

function renderResult(){
  var A=state.answers,D=diag(),name=A.name?esc(A.name):'';
  var focus=[].concat(A.metas||[],A.zonas||[]).slice(0,6);
  var zHtml=focus.length?'<div class="sp-attack"><b>Tu plan también trabaja:</b>'+focus.map(function(z){return '<div class="z"><span class="ck">✓</span><span>'+esc(z)+'</span></div>';}).join('')+'</div>':'';
  stage.innerHTML='<div class="sp-result"><span class="sp-phase">Tu resultado'+(name?' · '+name:'')+'</span>'+
    '<h1 class="sp-h">'+(name?name+', tu':'Tu')+' nervio vago está <span class="am">pidiendo ayuda</span></h1>'+
    '<div class="sp-scorecard"><div style="font-size:13px;color:var(--soft);font-weight:700">Nivel de desregulación del nervio vago</div><span class="sp-level">'+D.level.toUpperCase()+'</span>'+
    '<div class="sp-scalebar"><div class="sp-pin" id="spPin" style="left:0">Vos · '+D.pct+'%</div><div class="sp-pin-dot" id="spDot" style="left:0"></div></div>'+
    '<div class="sp-scale"><span>Bajo</span><span>Normal</span><span>Medio</span><span>Alto</span></div></div>'+
    '<div class="sp-alert">☝️ <b>Desregulación '+D.level.toLowerCase()+'.</b> Tu cuerpo está trabado en modo alerta. Eso dispara la ansiedad, el cansancio y la niebla mental, y con el tiempo sube la inflamación y la presión.</div>'+
    '<div class="sp-facts"><div class="sp-fact"><div class="k">Sistema nervioso</div><div class="v bad">Modo supervivencia</div></div>'+
      '<div class="sp-fact"><div class="k">Señales de alerta</div><div class="v bad">'+D.signs+'/50</div></div>'+
      '<div class="sp-fact"><div class="k">Nivel de energía</div><div class="v bad">'+D.energy+'%</div></div>'+
      '<div class="sp-fact"><div class="k">Foco recomendado</div><div class="v good">Activar el nervio vago</div></div></div>'+
    '<div class="sp-vsbox"><div class="nowb"><div class="lab">Hoy</div><div class="v">Modo alerta</div></div><div class="goalb"><div class="lab">El '+D.end+'</div><div class="v">Modo calma</div></div></div>'+
    '<div id="spProj" style="margin:18px 0 4px"></div>'+zHtml+
    '<button class="sp-cta" id="spGo">Ver mi plan personalizado</button></div>';
  setTimeout(function(){var l=Math.min(94,Math.max(6,D.pct))+'%';document.getElementById('spPin').style.left=l;document.getElementById('spDot').style.left=l;},250);
  document.getElementById('spProj').appendChild(spProjection({headline:'Según tus respuestas, reseteás tu nervio vago para el <span style="color:var(--ac)">'+D.end+'</span>',fromLabel:'Alerta '+D.pct+'%',toLabel:'Calma',endLabel:'Día 28'}));
  stage.querySelectorAll('.sp-attack .z').forEach(function(z,i){setTimeout(function(){z.classList.add('in');},700+i*130);});
  document.getElementById('spGo').onclick=renderSale;
}

function seg(n,cls){var h='<div class="sp-seg '+cls+'">';for(var i=0;i<5;i++)h+='<i class="'+(i<n?'f':'')+'"></i>';return h+'</div>';}
function renderSale(){
  document.querySelector('.sp-bar').style.display='none';document.querySelector('.sp-top').style.display='none';
  var A=state.answers,name=A.name?esc(A.name):'',O=CONFIG.OFFER,brand=esc(CONFIG.BRAND_PLAIN);
  var hero=CONFIG.IMG.sale_hero?'<img src="'+CONFIG.IMG.sale_hero+'" alt="Antes y después">':'ANTES / DESPUÉS';
  var offer='<div class="sp-offer"><span class="tagtop">★ Precio especial de hoy</span><div class="sp-offer-row"><div class="n">'+esc(O.name)+'<small>'+esc(O.sub)+'</small><span class="off">'+esc(O.off)+'</span></div>'+
    '<div style="text-align:right"><div class="old">'+esc(O.old)+'</div><div class="now">'+esc(O.now)+'</div><span class="pd">'+esc(O.perday)+'</span></div></div><div class="bon">'+esc(O.bonus)+'</div></div>'+
    '<a class="sp-cta buy" href="'+esc(CONFIG.BUY_URL+location.search)+'">Quiero mi plan de 28 días</a>'+
    '<p class="sp-fine">Pago único de '+esc(O.now)+'. Sin suscripción ni cargos automáticos. Lo recibís al instante por mail.</p>'+
    '<div class="sp-pay"><span>🔒 Pago seguro con Mercado Pago</span><div class="sp-cards"><span>Mercado Pago</span><span>VISA</span><span>Mastercard</span><span>Amex</span><span>Débito</span></div></div>';
  var block=function(){return '<h2 class="sp-sec-h" style="margin-top:6px">'+(name?name+', tu':'Tu')+' plan para salir del <span class="am">modo alerta</span> está listo</h2>'+
    '<div class="sp-promo">🎉 <span><b>¡Descuento aplicado!</b><br>Vale mientras corra el reloj</span><code>'+CONFIG.PROMO+'</code></div>'+offer;};
  stage.style.padding='0';
  stage.innerHTML='<div class="sp-timer"><div class="t">Tu descuento vence en<b id="spClock">'+CONFIG.TIMER_MIN+':00</b></div><a href="#oferta">Quiero mi plan</a></div>'+
    '<div class="sp-salebody">'+
    '<div class="sp-ba"><div class="sp-ba-img">'+hero+'<div class="sp-ba-tags"><span>Ahora</span><span>Día 28</span></div></div>'+
    '<div class="sp-ba-rows"><div>Energía<b>Sin pila</b>'+seg(1,'bad')+'</div><div>Energía<b>Con pila todo el día</b>'+seg(5,'good')+'</div>'+
    '<div>Sistema nervioso<b>Modo alerta</b>'+seg(1,'bad')+'</div><div>Sistema nervioso<b>En calma</b>'+seg(4,'good')+'</div>'+
    '<div>Ánimo<b>Irritable</b>'+seg(2,'bad')+'</div><div>Ánimo<b>Tranquila y presente</b>'+seg(5,'good')+'</div></div></div>'+
    '<div id="oferta">'+block()+'</div>'+
    '<div class="sp-sec"><h2 class="sp-sec-h">Lo que vas a <span class="am">sentir</span></h2><ul class="sp-goals">'+CONFIG.GOALS.map(function(g){return '<li><span class="ck">✓</span><span>'+esc(g)+'</span></li>';}).join('')+'</ul></div>'+
    '<div class="sp-sec"><h2 class="sp-sec-h">Qué incluye tu <span class="am">plan</span></h2><div class="sp-mock" style="margin-bottom:14px">'+(CONFIG.IMG.program?'<img src="'+CONFIG.IMG.program+'" alt="">':'MOCKUP')+'</div><ul class="sp-incl">'+
      CONFIG.INCLUDES.map(function(x){return '<li><span class="e">'+x.e+'</span><div><b>'+esc(x.t)+'</b><span class="s">'+esc(x.s)+'</span></div>'+(x.val?'<span class="val">'+esc(x.val)+'</span>':'')+'</li>';}).join('')+'</ul></div>'+
    '<div class="sp-sec"><h2 class="sp-sec-h">Tus <span class="am">4 semanas</span></h2><div class="sp-how">'+CONFIG.HOW.map(function(h,i){return '<div class="st"><div class="num">'+(i+1)+'</div><div><b>'+esc(h.t)+'</b><p>'+esc(h.d)+'</p></div></div>';}).join('')+'</div></div>'+
    '<div class="sp-sec"><h2 class="sp-sec-h">Gente como vos <span class="am">ya lo logró</span></h2><div class="sp-stats">'+CONFIG.STATS.map(function(s){return '<div class="sp-stat"><b>'+esc(s.n)+'</b><span>'+esc(s.t)+'</span></div>';}).join('')+'</div></div>'+
    '<div class="sp-sec"><h2 class="sp-sec-h">Lo que dicen <span class="am">las que ya lo hicieron</span></h2><div class="sp-tst">'+CONFIG.TESTIMONIALS.map(function(t){return '<div class="c"><div class="top"><span class="stars">★★★★★</span><span class="ver">✓ Compra verificada</span></div><div class="tt">'+esc(t.tt)+'</div><p class="q">'+esc(t.text)+'</p><div class="who">'+esc(t.name)+'</div></div>';}).join('')+'</div></div>'+
    '<div class="sp-sec sp-faq"><h2 class="sp-sec-h">Preguntas <span class="am">frecuentes</span></h2>'+CONFIG.FAQ.map(function(f){return '<div class="it"><button class="q">'+esc(f.q)+'</button><div class="a">'+esc(f.a)+'</div></div>';}).join('')+'</div>'+
    '<div class="sp-sec">'+block()+'</div>'+
    '<div class="sp-guar"><span class="g">🛡️</span><div><b>Garantía de 7 días</b>Hacé el plan. Si en 7 días sentís que no es para vos, te devolvemos el 100% de la plata. Sin vueltas.</div></div>'+
    '<p class="sp-disc">Este plan es educativo y no reemplaza la consulta con un profesional de la salud. Los resultados varían según cada persona.</p></div>';
  stage.querySelectorAll('.sp-faq .q').forEach(function(b){b.onclick=function(){b.parentElement.classList.toggle('open');};});
  var tot=CONFIG.TIMER_MIN*60,clk=document.getElementById('spClock');
  var ci=setInterval(function(){tot--;if(tot<0){clearInterval(ci);return;}var m=Math.floor(tot/60),s=tot%60;clk.textContent=m+':'+(s<10?'0':'')+s;},1000);
  window.scrollTo({top:0});
}
render();
})();
</script>
